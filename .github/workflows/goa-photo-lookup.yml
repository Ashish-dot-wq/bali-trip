# One-off: find Wikimedia Commons photos for the Goa app (reviewed by hand, then removed).
name: Goa photo lookup
on:
  push:
    branches: [claude/wizardly-feynman-2ugicp]
    paths: [goa/scripts/find-photos.mjs]
permissions:
  contents: write
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node goa/scripts/find-photos.mjs
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          mkdir out && cp photos.json out/ && cd out && git init -q -b goa-photo-lookup
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos.json && git commit -qm "Goa photo lookup"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" goa-photo-lookup
