# Refreshes the app's Local news feed about every 30 minutes.
#
# How it keeps running: GitHub's cron scheduler proved unreliable for this repo (it never fired),
# so each run refreshes the feed, waits 30 minutes, then starts the next run itself
# (workflow_dispatch is allowed with the built-in GITHUB_TOKEN). The cron schedule stays as a
# backup that can restart the loop if it ever breaks. Runs queue (never overlap), so there is
# only ever one loop. The loop stops by itself after the trip.
#
# Builds news.json with scripts/fetch-news.mjs and publishes it to the `news-feed` branch,
# which the app reads (so the Pages branch isn't touched).
name: Local news feed

on:
  schedule:
    - cron: "17,47 * * * *"  # backup only; GitHub may run these late or not at all
  workflow_dispatch:          # also the "Run workflow" button in the Actions tab
  push:
    branches: [claude/wizardly-feynman-2ugicp]
    paths:
      - scripts/fetch-news.mjs
      - .github/workflows/news.yml

permissions:
  contents: write   # publish news.json to the news-feed branch
  actions: write    # start the next run

# One run at a time; a newer queued run replaces an older queued one, so loops never multiply.
concurrency:
  group: news-feed
  cancel-in-progress: false

env:
  LOOP_UNTIL: "20261228"   # stop scheduling new runs after this date (UTC, YYYYMMDD)
  WAIT_MINUTES: "30"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get the current feed (kept if every source fails)
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/news-feed/news.json" -o prev.json || echo '{}' > prev.json

      - name: Build news.json
        run: node scripts/fetch-news.mjs prev.json news.json

      - name: Publish to the news-feed branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && cp news.json out/ && cd out
          git init -q -b news-feed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -qm "Update local news feed"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" news-feed

  next-run:
    # Runs even if the refresh failed (so one bad run doesn't end the loop), but not if cancelled.
    needs: refresh
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait, then start the next refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(date -u +%Y%m%d)" -gt "$LOOP_UNTIL" ]; then
            echo "Trip is over; not scheduling more runs."
            exit 0
          fi
          sleep $(( WAIT_MINUTES * 60 ))
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/news.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
          echo "Next refresh started."
